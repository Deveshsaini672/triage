x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://triage:triage@postgres:5432/triage
  REDIS_BROKER_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  REDIS_RATELIMIT_URL: redis://redis:6379/2

x-app: &app
  build: .
  env_file: .env
  environment: *app-env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app
    command: celery -A app.celery_app worker -l info --concurrency 4
    depends_on:
      api: {condition: service_healthy}

  beat:
    <<: *app
    command: celery -A app.celery_app beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
